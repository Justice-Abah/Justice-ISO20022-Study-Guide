<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 20022 Payments Study Guide by Justice</title>
<style>
/* Layout: one reading column, sticky-free; each interactive section sits in a quiet card */
:root{
  --bg:#f6f8f9; --surface:#ffffff; --ink:#15212a; --muted:#566570;
  --cds-text-primary:#15212a; --cds-text-secondary:#566570; --cds-chart-grid:#d9e0e5;
  --cds-chart-categorical-1:#1f6fd1; --cds-chart-categorical-2:#0f8a6a; --cds-chart-categorical-3:#b26a00; --cds-chart-categorical-4:#8a4fc4;
  --cds-chart-status-good:#1d8a4e; --cds-chart-status-critical:#c0392b; --cds-chart-status-warning:#c27c00;
  --body:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10171c; --surface:#172129; --ink:#e3eaee; --muted:#9db0bb;
  --cds-text-primary:#e3eaee; --cds-text-secondary:#9db0bb; --cds-chart-grid:#2c3a44;
  --cds-chart-categorical-1:#5ba3f5; --cds-chart-categorical-2:#3cc19c; --cds-chart-categorical-3:#e0a94a; --cds-chart-categorical-4:#b88bea;
  --cds-chart-status-good:#4cc483; --cds-chart-status-critical:#f07a6c; --cds-chart-status-warning:#e9b04c;
  color-scheme: dark;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px))}
#root{max-width:860px;margin:0 auto}
.top{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(28px,5vw,40px);line-height:1.12;margin:0;text-wrap:balance}
.byline{margin:0;color:var(--muted)}
.credit{margin:0;font-style:italic;max-width:68ch}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
nav a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--cds-chart-grid);border-radius:999px;padding:4px 11px;background:var(--surface)}
nav a:hover{border-color:var(--cds-chart-categorical-1)}
section{margin-top:44px;scroll-margin-top:16px}
h2{font-size:26px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
h3{font-size:19px;margin:28px 0 6px}
.lead{margin:0 0 14px;max-width:70ch}
.widget{background:var(--surface);border:1px solid var(--cds-chart-grid);border-radius:14px;padding:18px;margin:6px 0 14px;min-width:0}
.check{list-style:none;padding:0;margin:8px 0 14px;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.tl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media (max-width:620px){.tl-grid{grid-template-columns:1fr}.widget{padding:12px}}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--cds-chart-grid);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--cds-chart-grid);vertical-align:top}
thead th{border-top:none;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
a{color:var(--cds-chart-categorical-1)}
.note{color:var(--muted);font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cds-chart-categorical-1);outline-offset:2px}
button:disabled{cursor:default}
footer{max-width:860px;margin:56px auto 0;color:var(--muted);font-size:13px;border-top:1px solid var(--cds-chart-grid);padding-top:14px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
